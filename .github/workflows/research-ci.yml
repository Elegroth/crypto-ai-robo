name: Research CI

on:
  push:
    branches:
      - develop
      - master
    paths:
      - "crypto-robo-research/**"
      - ".github/workflows/research-ci.yml"
  pull_request:
    paths:
      - "crypto-robo-research/**"
      - ".github/workflows/research-ci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto-robo-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
