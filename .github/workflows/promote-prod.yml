name: Promote Prod

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      TF_STATE_LOCK_TABLE: crypto-robo-terraform-locks
      TF_STATE_KEY: envs/prod/terraform.tfstate
    defaults:
      run:
        working-directory: crypto-robo-infra/envs/prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Build runtime package
        working-directory: crypto-robo-runtime
        run: |
          python -m pip install --upgrade pip
          mkdir -p ../dist/package
          pip install . -t ../dist/package
          cd ../dist/package
          zip -r ../runtime-prod.zip .
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve Terraform backend
        id: backend
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "bucket=crypto-robo-tfstate-${ACCOUNT_ID}-${AWS_REGION}" >> "$GITHUB_OUTPUT"
      - name: Ensure Terraform backend resources
        run: |
          BUCKET="${{ steps.backend.outputs.bucket }}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket already exists: $BUCKET"
          else
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          if aws dynamodb describe-table --table-name "$TF_STATE_LOCK_TABLE" >/dev/null 2>&1; then
            echo "Lock table already exists: $TF_STATE_LOCK_TABLE"
          else
            aws dynamodb create-table \
              --table-name "$TF_STATE_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$TF_STATE_LOCK_TABLE"
          fi
      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -backend-config="encrypt=true"
      - name: Terraform plan
        run: terraform plan -out=tfplan -var="runtime_package_path=${{ github.workspace }}/dist/runtime-prod.zip"
      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
      - name: Workflow summary
        if: always()
        working-directory: .
        run: |
          echo "## Prod Workflow" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Terraform State Bucket: ${{ steps.backend.outputs.bucket }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Terraform State Key: ${TF_STATE_KEY}" >> "$GITHUB_STEP_SUMMARY"
