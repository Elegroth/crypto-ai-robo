name: Deploy Dev

on:
  push:
    branches:
      - develop
    paths:
      - "crypto-robo-runtime/**"
      - "crypto-robo-infra/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the dev stack or clean up previously created dev resources.
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - cleanup

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      OPERATION: ${{ github.event.inputs.operation || 'deploy' }}
      PREFIX: crypto-robo-dev
      TF_STATE_LOCK_TABLE: crypto-robo-terraform-locks
      TF_STATE_KEY: envs/dev/terraform.tfstate
    defaults:
      run:
        working-directory: crypto-robo-infra/envs/dev
    steps:
      - uses: actions/checkout@v4
        if: env.OPERATION == 'deploy'
      - uses: actions/setup-python@v5
        if: env.OPERATION == 'deploy'
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        if: env.OPERATION == 'deploy'
        with:
          terraform_version: 1.7.5
      - name: Build runtime package
        if: env.OPERATION == 'deploy'
        working-directory: crypto-robo-runtime
        run: |
          python -m pip install --upgrade pip
          mkdir -p ../dist/package
          pip install . -t ../dist/package
          cd ../dist/package
          zip -r ../runtime-dev.zip .
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve Terraform backend
        if: env.OPERATION == 'deploy'
        id: backend
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "bucket=crypto-robo-tfstate-${ACCOUNT_ID}-${AWS_REGION}" >> "$GITHUB_OUTPUT"
      - name: Ensure Terraform backend resources
        if: env.OPERATION == 'deploy'
        run: |
          BUCKET="${{ steps.backend.outputs.bucket }}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket already exists: $BUCKET"
          else
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          if aws dynamodb describe-table --table-name "$TF_STATE_LOCK_TABLE" >/dev/null 2>&1; then
            echo "Lock table already exists: $TF_STATE_LOCK_TABLE"
          else
            aws dynamodb create-table \
              --table-name "$TF_STATE_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$TF_STATE_LOCK_TABLE"
          fi
      - name: Terraform init
        if: env.OPERATION == 'deploy'
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -backend-config="encrypt=true"
      - name: Terraform plan
        if: env.OPERATION == 'deploy'
        run: terraform plan -out=tfplan -var="runtime_package_path=${{ github.workspace }}/dist/runtime-dev.zip"
      - name: Terraform apply
        if: env.OPERATION == 'deploy'
        run: terraform apply -auto-approve tfplan
      - name: Cleanup dev resources
        if: env.OPERATION == 'cleanup'
        working-directory: .
        run: |
          aws events remove-targets --rule "$PREFIX-daily-refresh" --ids daily-refresh >/dev/null 2>&1 || true
          aws events remove-targets --rule "$PREFIX-weekly-rebalance" --ids weekly-rebalance >/dev/null 2>&1 || true
          aws events delete-rule --name "$PREFIX-daily-refresh" >/dev/null 2>&1 || true
          aws events delete-rule --name "$PREFIX-weekly-rebalance" >/dev/null 2>&1 || true
          ARN="$(aws stepfunctions list-state-machines --query \"stateMachines[?name=='$PREFIX-rebalance'].stateMachineArn | [0]\" --output text)"
          if [ "$ARN" != "None" ] && [ -n "$ARN" ]; then
            aws stepfunctions delete-state-machine --state-machine-arn "$ARN"
          fi
          aws lambda delete-function --function-name "$PREFIX" >/dev/null 2>&1 || true
          aws logs delete-log-group --log-group-name "/aws/lambda/$PREFIX" >/dev/null 2>&1 || true
          aws iam delete-role-policy --role-name "$PREFIX-lambda-role" --policy-name "$PREFIX-lambda-runtime" >/dev/null 2>&1 || true
          aws iam delete-role-policy --role-name "$PREFIX-step-functions-role" --policy-name "$PREFIX-step-functions" >/dev/null 2>&1 || true
          aws iam delete-role-policy --role-name "$PREFIX-eventbridge-step-functions-role" --policy-name "$PREFIX-eventbridge-step-functions" >/dev/null 2>&1 || true
          aws iam detach-role-policy --role-name "$PREFIX-lambda-role" --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole >/dev/null 2>&1 || true
          aws iam delete-role --role-name "$PREFIX-lambda-role" >/dev/null 2>&1 || true
          aws iam delete-role --role-name "$PREFIX-step-functions-role" >/dev/null 2>&1 || true
          aws iam delete-role --role-name "$PREFIX-eventbridge-step-functions-role" >/dev/null 2>&1 || true
          aws dynamodb delete-table --table-name "$PREFIX-state" >/dev/null 2>&1 || true
          aws s3 rm "s3://$PREFIX-reports" --recursive >/dev/null 2>&1 || true
          aws s3api delete-bucket --bucket "$PREFIX-reports" >/dev/null 2>&1 || true
          KEY_ID="$(aws kms list-aliases --query \"Aliases[?AliasName=='alias/$PREFIX'].TargetKeyId | [0]\" --output text)"
          aws kms delete-alias --alias-name "alias/$PREFIX" >/dev/null 2>&1 || true
          if [ "$KEY_ID" != "None" ] && [ -n "$KEY_ID" ]; then
            aws kms schedule-key-deletion --key-id "$KEY_ID" --pending-window-in-days 7 >/dev/null 2>&1 || true
          fi
      - name: Workflow summary
        if: always()
        working-directory: .
        run: |
          echo "## Dev Workflow" >> "$GITHUB_STEP_SUMMARY"
          echo "- Operation: $OPERATION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OPERATION" = "deploy" ] && [ -n "${{ steps.backend.outputs.bucket }}" ]; then
            echo "- Terraform State Bucket: ${{ steps.backend.outputs.bucket }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Terraform State Key: ${TF_STATE_KEY}" >> "$GITHUB_STEP_SUMMARY"
          fi
