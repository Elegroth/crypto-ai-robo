name: Deploy Dev

on:
  push:
    branches:
      - develop
    paths:
      - "crypto-robo-runtime/**"
      - "crypto-robo-infra/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
    defaults:
      run:
        working-directory: crypto-robo-infra/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Build runtime package
        working-directory: crypto-robo-runtime
        run: |
          python -m pip install --upgrade pip
          mkdir -p ../dist/package
          pip install . -t ../dist/package
          cd ../dist/package
          zip -r ../runtime-dev.zip .
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Terraform init
        run: terraform init
      - name: Terraform plan
        run: terraform plan -out=tfplan -var="runtime_package_path=${{ github.workspace }}/dist/runtime-dev.zip"
      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
      - name: Deployment summary
        run: |
          echo "## Dev Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> $GITHUB_STEP_SUMMARY
          echo "- CloudWatch Log Group: /aws/lambda/crypto-robo-dev" >> $GITHUB_STEP_SUMMARY
          echo "- Step Functions State Machine: crypto-robo-dev-rebalance" >> $GITHUB_STEP_SUMMARY
