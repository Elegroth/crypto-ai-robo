name: Deploy Dev

on:
  push:
    branches:
      - develop
    paths:
      - "crypto-robo-runtime/**"
      - "crypto-robo-infra/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      TF_STATE_LOCK_TABLE: crypto-robo-terraform-locks
      TF_STATE_KEY: envs/dev/terraform.tfstate
    defaults:
      run:
        working-directory: crypto-robo-infra/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Build runtime package
        working-directory: crypto-robo-runtime
        run: |
          python -m pip install --upgrade pip
          mkdir -p ../dist/package
          pip install . -t ../dist/package
          cd ../dist/package
          zip -r ../runtime-dev.zip .
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve Terraform backend
        id: backend
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "bucket=crypto-robo-tfstate-${ACCOUNT_ID}-${AWS_REGION}" >> "$GITHUB_OUTPUT"
      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -backend-config="encrypt=true"
      - name: Terraform plan
        run: terraform plan -out=tfplan -var="runtime_package_path=${{ github.workspace }}/dist/runtime-dev.zip"
      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
      - name: Deployment summary
        run: |
          echo "## Dev Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Terraform State Bucket: ${{ steps.backend.outputs.bucket }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Terraform State Key: ${TF_STATE_KEY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CloudWatch Log Group: /aws/lambda/crypto-robo-dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Step Functions State Machine: crypto-robo-dev-rebalance" >> "$GITHUB_STEP_SUMMARY"
